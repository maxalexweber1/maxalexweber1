<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" role="img" aria-label="Max Weber, enterprise solutions, OData services, blockchain infrastructure">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#0FAAFF"/>
      <stop offset="55%" stop-color="#4F8BFF"/>
      <stop offset="100%" stop-color="#8E31E2"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#0033AD" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0033AD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8E31E2" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8E31E2" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card">
      <rect x="1" y="1" width="878" height="228" rx="16"/>
    </clipPath>
    <style>
      .name    { font: 800 52px "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill: #E6EDF3; letter-spacing: -1.5px; }
      .tag     { font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8B96A5; letter-spacing: 0.4px; }
      .pill    { fill: rgba(17, 24, 39, 0.65); stroke: #263244; }
      .pilltxt { font: 600 13px "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill: #A9B4C4; }
      .star    { fill: #E6EDF3; animation: twinkle 3.6s ease-in-out infinite; }
      .cursor  { animation: blink 1.1s steps(1) infinite; }
      @keyframes twinkle { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.75; } }
      @keyframes blink   { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    </style>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="878" height="228" rx="16" fill="#0B0F1A" stroke="#1E2836" stroke-width="1.5"/>

  <g clip-path="url(#card)">
    <!-- ambient glows -->
    <circle cx="760" cy="40"  r="220" fill="url(#glowBlue)"/>
    <circle cx="640" cy="230" r="200" fill="url(#glowPurple)"/>

    <!-- stars -->
    <circle class="star" cx="600" cy="60"  r="2.4" style="animation-delay: 0s"/>
    <circle class="star" cx="668" cy="92"  r="3.0" style="animation-delay: 0.6s"/>
    <circle class="star" cx="640" cy="156" r="2.2" style="animation-delay: 1.2s"/>
    <circle class="star" cx="742" cy="70"  r="2.6" style="animation-delay: 1.8s"/>
    <circle class="star" cx="812" cy="118" r="3.2" style="animation-delay: 2.4s"/>
    <circle class="star" cx="770" cy="176" r="2.2" style="animation-delay: 3.0s"/>
    <circle class="star" cx="560" cy="130" r="1.8" style="animation-delay: 0.9s"/>
    <circle class="star" cx="705" cy="200" r="1.8" style="animation-delay: 2.1s"/>
    <circle class="star" cx="852" cy="52"  r="1.8" style="animation-delay: 1.5s"/>
    <circle class="star" cx="536" cy="42"  r="1.6" style="animation-delay: 2.7s"/>

    <!-- orbit ring -->
    <g>
      <circle cx="756" cy="112" r="72" fill="none" stroke="url(#accent)" stroke-width="2"
              stroke-dasharray="10 14" stroke-linecap="round" opacity="0.85">
        <animateTransform attributeName="transform" type="rotate"
                          from="0 756 112" to="360 756 112" dur="26s" repeatCount="indefinite"/>
      </circle>
      <circle cx="756" cy="112" r="7" fill="url(#accent)"/>
      <circle cx="756" cy="40" r="4" fill="#0FAAFF">
        <animateTransform attributeName="transform" type="rotate"
                          from="0 756 112" to="360 756 112" dur="26s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- name -->
    <text class="name" x="48" y="104">Max Weber<tspan fill="url(#accent)">.</tspan></text>

    <!-- accent bar with travelling shimmer -->
    <rect x="48" y="120" width="238" height="3.5" rx="1.75" fill="url(#accent)"/>
    <rect x="48" y="120" width="70" height="3.5" rx="1.75" fill="url(#shimmer)">
      <animateTransform attributeName="transform" type="translate"
                        from="-80 0" to="260 0" dur="3.2s" repeatCount="indefinite"/>
    </rect>

    <!-- tagline -->
    <text class="tag" x="48" y="156">Enterprise solutions&#160;·&#160;OData services&#160;·&#160;Blockchain infrastructure<tspan class="cursor" fill="#0FAAFF">&#160;▍</tspan></text>

    <!-- pills -->
    <g>
      <rect class="pill" x="48"  y="176" width="76" height="30" rx="15"/>
      <text class="pilltxt" x="86"  y="195.5" text-anchor="middle">SAP CAP</text>

      <rect class="pill" x="134" y="176" width="78" height="30" rx="15"/>
      <text class="pilltxt" x="173" y="195.5" text-anchor="middle">Cardano</text>

      <rect class="pill" x="222" y="176" width="82" height="30" rx="15"/>
      <text class="pilltxt" x="263" y="195.5" text-anchor="middle">Midnight</text>

      <rect class="pill" x="314" y="176" width="60" height="30" rx="15"/>
      <text class="pilltxt" x="344" y="195.5" text-anchor="middle">Aiken</text>

      <rect class="pill" x="384" y="176" width="94" height="30" rx="15"/>
      <text class="pilltxt" x="431" y="195.5" text-anchor="middle">TypeScript</text>

      <rect class="pill" x="488" y="176" width="58" height="30" rx="15"/>
      <text class="pilltxt" x="517" y="195.5" text-anchor="middle">ABAP</text>

      <rect class="pill" x="556" y="176" width="66" height="30" rx="15"/>
      <text class="pilltxt" x="589" y="195.5" text-anchor="middle">Pebble</text>
    </g>
  </g>
</svg>
